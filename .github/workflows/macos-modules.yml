name: macOS modules (arm64)

# Builds the MicronSDR decoder libraries for macOS on Apple silicon from
# tools/micronsdr-modules/* with their own build_macos.sh scripts:
#   libftx.dylib (FT8 / FT4 / WSPR), libjs8.dylib (JS8), libfdv.dylib + libcodec2.1.2.dylib (FreeDV).
# Each script checks its result (arm64 only, minos 14.4, @rpath install_name, exports, ad hoc
# signature, only system dependencies) and runs its test. The libraries and the logs are
# uploaded as artifacts; nothing is committed back.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/micronsdr-modules/**'
      - '.github/workflows/macos-modules.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15   # Apple silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          uname -a
          sw_vers
          xcodebuild -version || true
          brew install gcc boost eigen cmake || true
          # gfortran of Homebrew: the unversioned link, or the newest gfortran-N
          FC=$(command -v gfortran || ls -1 $(brew --prefix)/bin/gfortran-* 2>/dev/null | sort -V | tail -1)
          echo "FC=$FC" >> "$GITHUB_ENV"
          "$FC" --version | head -1

      - name: libftx.dylib (FT_src)
        id: ftx
        continue-on-error: true
        working-directory: tools/micronsdr-modules/FT_src
        run: ./build_macos.sh

      - name: libftx.dylib with the classic linker (if the first try failed)
        id: ftx2
        if: steps.ftx.outcome == 'failure'
        continue-on-error: true
        working-directory: tools/micronsdr-modules/FT_src
        run: |
          cp build_macos.log build_macos_first.log || true
          EXTRA_LDFLAGS=-Wl,-ld_classic ./build_macos.sh

      - name: libjs8.dylib (JS8_src)
        id: js8
        continue-on-error: true
        working-directory: tools/micronsdr-modules/JS8_src
        run: ./build_macos.sh

      - name: libfdv.dylib + libcodec2.1.2.dylib (FreeDV_src)
        id: fdv
        continue-on-error: true
        working-directory: tools/micronsdr-modules/FreeDV_src
        run: ./build_macos.sh "$RUNNER_TEMP/fdv_deps"

      - name: Collect
        if: always()
        run: |
          O=$RUNNER_TEMP/macos-modules; mkdir -p $O/logs
          M=tools/micronsdr-modules
          for f in $M/FT_src/libftx.dylib $M/JS8_src/libjs8.dylib \
                   $M/FreeDV_src/libfdv.dylib $M/FreeDV_src/libcodec2.1.2.dylib; do
            [ -f "$f" ] && cp "$f" $O/
          done
          for d in FT_src JS8_src FreeDV_src; do
            for l in $M/$d/build_macos*.log; do [ -f "$l" ] && cp "$l" "$O/logs/${d}_$(basename "$l")"; done
          done
          cp $M/FT_src/MACOS_MODULES.txt $O/ 2>/dev/null || true
          ( cd $O && ls -l && shasum -a 256 *.dylib > SHA256SUMS.txt 2>/dev/null || true )
          for f in $O/*.dylib; do
            [ -f "$f" ] || continue
            echo "== $f"; lipo -archs "$f"; otool -L "$f"; codesign -dv "$f" 2>&1 | head -3
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micronsdr-macos-arm64-modules
          path: ${{ runner.temp }}/macos-modules
          if-no-files-found: warn

      - name: Result
        if: always()
        run: |
          echo "ftx: ${{ steps.ftx.outcome }} / classic linker: ${{ steps.ftx2.outcome }}"
          echo "js8: ${{ steps.js8.outcome }}"
          echo "fdv: ${{ steps.fdv.outcome }}"
          ok=1
          [ "${{ steps.ftx.outcome }}" = success ] || [ "${{ steps.ftx2.outcome }}" = success ] || ok=0
          [ "${{ steps.js8.outcome }}" = success ] || ok=0
          [ "${{ steps.fdv.outcome }}" = success ] || ok=0
          [ $ok = 1 ]
