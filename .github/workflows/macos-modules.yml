name: macOS modules (arm64)

# Builds the MicronSDR decoder libraries for macOS on Apple silicon from
# tools/micronsdr-modules/* with their own build_macos.sh scripts:
#   libftx.dylib (FT8 / FT4 / WSPR), libjs8.dylib (JS8), libfdv.dylib + libcodec2.1.2.dylib (FreeDV).
# Each script checks its result (arm64 only, minos 14.4, @rpath install_name, exports, ad hoc
# signature, only system dependencies) and runs its quick test; the step "Tests" runs the full
# set of the Linux journal. The libraries, test programs and logs are uploaded as an artifact
# and, when everything passed, committed to the branch macos-modules-bin (one commit per run,
# history replaced) so that they can be fetched with git.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/micronsdr-modules/**'
      - '.github/workflows/macos-modules.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # Apple silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          uname -a
          sw_vers
          xcodebuild -version || true
          brew install gcc boost eigen cmake || true
          # gfortran of Homebrew: the unversioned link, or the newest gfortran-N
          FC=$(command -v gfortran || ls -1 $(brew --prefix)/bin/gfortran-* 2>/dev/null | sort -V | tail -1)
          echo "FC=$FC" >> "$GITHUB_ENV"
          "$FC" --version | head -1

      - name: libftx.dylib (FT_src)
        id: ftx
        continue-on-error: true
        working-directory: tools/micronsdr-modules/FT_src
        run: ./build_macos.sh

      - name: libjs8.dylib (JS8_src)
        id: js8
        continue-on-error: true
        working-directory: tools/micronsdr-modules/JS8_src
        run: ./build_macos.sh

      - name: libfdv.dylib + libcodec2.1.2.dylib (FreeDV_src)
        id: fdv
        continue-on-error: true
        working-directory: tools/micronsdr-modules/FreeDV_src
        run: ./build_macos.sh "$RUNNER_TEMP/fdv_deps"

      - name: Tests (the set of LINUX_MODULES.txt)
        id: tests
        if: steps.ftx.outcome == 'success' && steps.js8.outcome == 'success' && steps.fdv.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          M=$PWD/tools/micronsdr-modules
          L=$RUNNER_TEMP/tests.log; : > $L
          t() { echo "\$ $*" | tee -a $L; "$@" 2>&1 | tee -a $L; }
          cd $M/FT_src; rm -f *.wav
          # the simulators seed rand() with the time: every run is a new noise realization, so
          # each SNR is tried several times and the decodes counted
          bad=0
          trial() {   # sim mode snr depth n
            local ok=0 i
            for i in $(seq $5); do
              ./$1 "CQ N7DDC CN87" 1500 0.0 0.1 1.0 1 $3 > /dev/null; sleep 1
              out=$(./test_ftx $2 000000_000001.wav "" $4 2>&1 || true)
              case "$out" in *"CQ N7DDC CN87"*) ok=$((ok+1)) ;; esac
            done
            echo "$2 $3 dB depth $4: $ok of $5" | tee -a $L
            R=$ok
          }
          for snr in -15 -19 -20 -21 -22; do
            for d in 1 3; do trial ft8sim ft8 $snr $d 10; if [ $snr = -15 ] && [ $R -lt 9 ]; then bad=1; fi; done
          done
          for snr in -12 -14 -16; do
            trial ft4sim ft4 $snr 3 10; if [ $snr = -12 ] && [ $R -lt 9 ]; then bad=1; fi
          done
          t ./ft8sim "CQ N7DDC CN87" 1500 0.0 0.1 1.0 1 -15 > /dev/null
          t ./test_ftx ft8 000000_000001.wav
          for snr in -26 -28; do
            ok=0
            for i in 1 2 3; do
              ./wsprgen "N7DDC CN87 37" $snr 1500 > /dev/null; sleep 1
              out=$(./test_ftx wspr wspr_test.wav 14.0956 3 2>&1 || true); echo "$out" >> $L
              case "$out" in *"N7DDC CN87 37"*) ok=$((ok+1)) ;; esac
            done
            echo "wspr $snr dB depth 3: $ok of 3" | tee -a $L
            if [ $snr = -26 ] && [ $ok = 0 ]; then bad=1; fi
          done
          rm -f *.wav
          [ $bad = 0 ] || { echo "!! FTX below the expected sensitivity"; exit 1; }
          cd $M/JS8_src; t ./test_js8
          cd $M/FreeDV_src
          t ./test_fdv offair "$RUNNER_TEMP/fdv_deps/rade_c"
          t ./test_fdv loop "$RUNNER_TEMP/fdv_deps/rade_c"
          rm -f *.wav

      - name: Collect
        if: always()
        run: |
          O=$RUNNER_TEMP/macos-modules; rm -rf $O; mkdir -p $O/FT_src/macos $O/JS8_src/macos $O/FreeDV_src/macos $O/logs
          M=tools/micronsdr-modules
          for f in libftx.dylib test_ftx ft8sim ft4sim wsprgen; do [ -f $M/FT_src/$f ] && cp $M/FT_src/$f $O/FT_src/macos/; done
          for f in libjs8.dylib test_js8; do [ -f $M/JS8_src/$f ] && cp $M/JS8_src/$f $O/JS8_src/macos/; done
          for f in libfdv.dylib libcodec2.1.2.dylib test_fdv; do [ -f $M/FreeDV_src/$f ] && cp $M/FreeDV_src/$f $O/FreeDV_src/macos/; done
          for d in FT_src JS8_src FreeDV_src; do
            [ -f $M/$d/build_macos.log ] && cp $M/$d/build_macos.log $O/logs/${d}_build_macos.log
          done
          [ -f $RUNNER_TEMP/tests.log ] && cp $RUNNER_TEMP/tests.log $O/logs/tests.log
          { sw_vers; xcodebuild -version | head -1; "$FC" --version | head -1; clang --version | head -1; } > $O/logs/toolchain.txt 2>&1 || true
          ( cd $O && find . -name '*.dylib' -o -perm -u+x -type f | sort | xargs shasum -a 256 > SHA256SUMS.txt ) || true
          for f in $(find $O -name '*.dylib'); do
            echo "== $f"; lipo -archs "$f"; otool -L "$f"; codesign -dv "$f" 2>&1 | head -3
            otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print "   minos " $2; exit}'
          done
          ls -lR $O

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micronsdr-macos-arm64-modules
          path: ${{ runner.temp }}/macos-modules
          if-no-files-found: warn

      - name: Publish to the branch macos-modules-bin
        if: steps.ftx.outcome == 'success' && steps.js8.outcome == 'success' && steps.fdv.outcome == 'success' && steps.tests.outcome == 'success'
        run: |
          O=$RUNNER_TEMP/macos-modules
          cd $O
          git init -q -b macos-modules-bin
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          echo "MicronSDR macOS arm64 modules built by run ${{ github.run_id }} from ${{ github.sha }}" > BUILD_INFO.txt
          git add -A
          git commit -qm "macOS arm64 modules: run ${{ github.run_id }}, source ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" macos-modules-bin

      - name: Result
        if: always()
        run: |
          echo "ftx: ${{ steps.ftx.outcome }}"
          echo "js8: ${{ steps.js8.outcome }}"
          echo "fdv: ${{ steps.fdv.outcome }}"
          echo "tests: ${{ steps.tests.outcome }}"
          [ "${{ steps.ftx.outcome }}" = success ] && [ "${{ steps.js8.outcome }}" = success ] && \
          [ "${{ steps.fdv.outcome }}" = success ] && [ "${{ steps.tests.outcome }}" = success ]
